[workspace]
resolver = "2"
members = [
    "crates/tont-common",
    "crates/tont-powerd",
    "crates/tont-appd",
    "crates/tont-syncd",
    "crates/tont-compositor",
    "crates/tont-shell",
    "crates/tont-telephony",
    "crates/tont-sensors",
    "crates/tont-input",
    "crates/tont-settings",
    "crates/tont-settings-app",
    "crates/tont-backup",
    "crates/tont-init",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TontOS Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
rustix = { version = "1.1", features = ["fs", "process", "time", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
