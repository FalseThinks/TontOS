title = "TontOS Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for i18n translation constants and generation scripts"
paths = [
    '''launcher_apk/src/org/tontos/launcher/I18n\.java''',
    '''bin/.*'''
]
regexes = [
    '''KEY_EQ_BAND_''',
    '''eq_band_''',
    '''KEY_BATTERY_''',
    '''battery_80_desc'''
]
