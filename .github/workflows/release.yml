name: Release Workflow

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: write

jobs:
  auto-tag-release:
    name: Auto-Tag & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Configuration
        id: release_config
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          BRANCH="${GITHUB_REF_NAME}"

          if [ "$BRANCH" = "main" ]; then
            TAG="v$VERSION"
            NAME="TontOS Release $TAG"
            PRERELEASE="false"
            MAKE_LATEST="true"
            TAG_MSG="Release $TAG (Automated TontOS Platform Build)"
          else
            # development branch -> pre-release (beta)
            TAG="v$VERSION-beta.${GITHUB_RUN_NUMBER}"
            NAME="TontOS Beta $TAG"
            PRERELEASE="true"
            MAKE_LATEST="false"
            TAG_MSG="Pre-release $TAG (Development Beta Build)"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "NAME=$NAME" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
          echo "TAG_MSG=$TAG_MSG" >> "$GITHUB_OUTPUT"
          echo "Target branch: $BRANCH | Tag: $TAG | Pre-release: $PRERELEASE"

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="${{ steps.release_config.outputs.TAG }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release creation."
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist; will create release."
          fi

      - name: Create and push Git tag
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          TAG="${{ steps.release_config.outputs.TAG }}"
          MSG="${{ steps.release_config.outputs.TAG_MSG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$MSG"
          git push origin "$TAG"

      - name: Setup Java 17
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;36.0.0'

      - name: Build Launcher APK
        if: steps.check_tag.outputs.EXISTS == 'false'
        env:
          OUTPUT_APK: tontos-launcher.apk
        run: ./scripts/build_launcher_apk.sh

      - name: Generate Executive Summary
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: ./scripts/generate_ci_report.sh RELEASE_AUDIT.md

      - name: Publish GitHub Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_config.outputs.TAG }}
          name: ${{ steps.release_config.outputs.NAME }}
          prerelease: ${{ steps.release_config.outputs.PRERELEASE == 'true' }}
          make_latest: ${{ steps.release_config.outputs.MAKE_LATEST }}
          body_path: RELEASE_AUDIT.md
          generate_release_notes: true
          files: |
            tontos-launcher.apk
            RELEASE_AUDIT.md
            NOTICE
            LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
