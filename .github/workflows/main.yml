name: TontOS CI, Tests & Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '30 4 * * 0'

jobs:
  rust-quality:
    name: Rust Format, Lint & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

      - name: Build release binaries
        run: cargo build --workspace --release

  rust-security:
    name: Rust Dependency Security Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit & cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run cargo audit (Advisory DB)
        run: cargo audit

      - name: Run cargo deny check
        run: cargo deny check

  android-build:
    name: Android Launcher Verification
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;36.0.0'

      - name: Build and verify launcher APK
        env:
          OUTPUT_APK: ${{ runner.temp }}/tontos-launcher.apk
        run: ./scripts/build_launcher_apk.sh

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: tontos-launcher
          path: ${{ runner.temp }}/tontos-launcher.apk
          if-no-files-found: error

  trivy-security-scan:
    name: Trivy Vulnerability & Misconfig Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: >-
          always() &&
          github.event.repository.private == false &&
          hashFiles('trivy-results.sarif') != '' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-results.sarif

  semgrep-sast-scan:
    name: Semgrep SAST Code Quality & Security
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: pip install semgrep && semgrep scan --config auto --sarif --output semgrep.sarif .

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: >-
          always() &&
          github.event.repository.private == false &&
          hashFiles('semgrep.sarif') != '' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: semgrep.sarif

  playwright-ui:
    name: Playwright UI Visual & DOM Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Playwright Dependencies
        working-directory: tests/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: tests/ui
        run: pnpm test

      - name: Upload Test Report & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/*.png

  codeql-analysis:
    name: CodeQL Java Analysis
    runs-on: ubuntu-latest
    if: github.event.repository.private == false
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34'

      - name: Compile Java Code
        run: |
          mkdir -p build/classes
          javac --release 17 -cp "$ANDROID_HOME/platforms/android-34/android.jar" -d build/classes $(find launcher_apk/src -name "*.java")

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
