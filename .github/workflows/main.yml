name: Main Workflow

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]
  schedule:
    # Daily verification at 05:00 UTC (07:00 AM CEST / Madrid time)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: Gatekeeper & Pre-flight Hygiene (~10s)
  # ============================================================================
  pr-target-guard:
    name: "1. Gatekeeper: PR Target Policy"
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR branch policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Target branch: $BASE_REF"
            echo "Source branch: $HEAD_REF"
            echo "Actor: $ACTOR"
            if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "development" ] && [ "$ACTOR" != "FalseThinks" ]; then
              echo "::error title=Forbidden PR Target::Direct Pull Requests targeting 'main' are forbidden! You must target the 'development' branch."
              exit 1
            fi
            echo "PR target branch policy verified successfully."
          else
            echo "Event is '$EVENT_NAME': PR target validation not applicable, continuing."
          fi

  hygiene-and-scripts:
    name: "1. Hygiene: Secrets & Script Syntax"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON syntax
        run: jq empty platform/manifests/pinned.json tests/ui/package.json

      - name: Check Shell scripts syntax
        run: bash -n scripts/*.sh

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 2: Build & Core Compilations (~35s)
  # ============================================================================
  rust-quality:
    name: "2. Build: Rust Format, Lint & Test"
    runs-on: ubuntu-latest
    needs: [pr-target-guard, hygiene-and-scripts]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Verify Rust documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  android-build:
    name: "2. Build: Android Launcher APK"
    runs-on: ubuntu-latest
    needs: [pr-target-guard, hygiene-and-scripts]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;36.0.0'

      - name: Build and verify launcher APK
        env:
          OUTPUT_APK: ${{ runner.temp }}/tontos-launcher.apk
        run: ./scripts/build_launcher_apk.sh

      - name: Verify APK signature and budget limits
        env:
          OUTPUT_APK: ${{ runner.temp }}/tontos-launcher.apk
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$OUTPUT_APK"
          APK_SIZE=$(wc -c < "$OUTPUT_APK")
          echo "APK Size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -gt 2097152 ]; then
            echo "ERROR: Launcher APK exceeded 2MB budget: $APK_SIZE bytes"
            exit 1
          fi

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: tontos-launcher
          path: ${{ runner.temp }}/tontos-launcher.apk
          if-no-files-found: error

  docker-builder-verification:
    name: "2. Build: Docker ROM Environment"
    runs-on: ubuntu-latest
    needs: [pr-target-guard, hygiene-and-scripts]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build TontOS ROM Builder Container
        run: |
          docker build -t tontos-builder:latest -f Dockerfile.aosp .

      - name: Verify Dependencies & Glibc Toolchain
        run: |
          docker run --rm tontos-builder:latest bash -c '
            set -euo pipefail
            echo "== 1. Verifying platform tools =="
            python3 --version
            javac -version
            repo --version | head -n 3
            ccache --version | head -n 1
            git --version
            zip -v | head -n 2

            echo "== 2. Verifying glibc sed regex compatibility =="
            RES=$(echo a | sed -E -e "s/a/b/")
            if [ "$RES" != "b" ]; then
              echo "ERROR: Regex incompatible: $RES"
              exit 1
            fi
            echo "sed regex OK: $RES"

            echo "== 3. Verifying ccache and non-root user permissions =="
            id
            ccache -s

            echo "== 4. Verifying workspace directory =="
            test -d /home/tontos/aosp
            echo "Container environment initialized successfully"
          '

      - name: Verify Compilation Pipeline Bootstrap
        run: |
          TMP_DIR=$(mktemp -d)
          mkdir -p "$TMP_DIR/build"
          echo 'echo "Mock envsetup loaded"' > "$TMP_DIR/build/envsetup.sh"
          chmod -R 777 "$TMP_DIR"
          AOSP_DIR="$TMP_DIR" ./scripts/docker_build_rom.sh bash -c "source build/envsetup.sh && echo 'AOSP compile pipeline bootstrap successful!'"
          rm -rf "$TMP_DIR"

  # ============================================================================
  # STAGE 3: Security & E2E Verification (~40s - 4m)
  # ============================================================================
  rust-security:
    name: "3. Security: Rust Dependency Audit"
    runs-on: ubuntu-latest
    needs: [rust-quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit & cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run cargo audit (Advisory DB)
        run: cargo audit

      - name: Run cargo deny check
        run: cargo deny check

  semgrep-sast-scan:
    name: "3. Security: Semgrep SAST Analysis"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    needs: [rust-quality, android-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: pip install semgrep && semgrep scan --config auto --sarif --output semgrep.sarif .

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: >-
          always() &&
          github.event.repository.private == false &&
          hashFiles('semgrep.sarif') != '' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: semgrep.sarif

  trivy-security-scan:
    name: "3. Security: Trivy Container & FS"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    needs: [docker-builder-verification]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: >-
          always() &&
          github.event.repository.private == false &&
          hashFiles('trivy-results.sarif') != '' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-results.sarif

  playwright-ui:
    name: "3. E2E: Playwright UI Visual Tests"
    runs-on: ubuntu-latest
    needs: [android-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Playwright Dependencies
        working-directory: tests/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: tests/ui
        run: pnpm test

      - name: Upload Test Report & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/*.png

  # ============================================================================
  # STAGE 4: Executive Gate & Health Report (~5s)
  # ============================================================================
  ci-executive-summary:
    name: "4. Executive: Health & Security Summary"
    runs-on: ubuntu-latest
    needs:
      - pr-target-guard
      - hygiene-and-scripts
      - rust-quality
      - android-build
      - docker-builder-verification
      - rust-security
      - semgrep-sast-scan
      - trivy-security-scan
      - playwright-ui
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Executive Security, Coverage & Code Smells Report
        run: |
          ./scripts/generate_ci_report.sh "$GITHUB_STEP_SUMMARY"
          ./scripts/generate_ci_report.sh ci-report.md

      - name: Upload Audit Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tontos-security-coverage-audit
          path: ci-report.md
